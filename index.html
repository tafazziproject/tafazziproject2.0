<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="shared/supabase-client.js"></script>
  <script src="shared/audio-store.js" defer></script>
  <script src="script.js" defer></script>
  <title>Tafazzi Project</title>
</head>

<body>
  <main id="app-shell">
    <!-- HOME -->
    <section id="home-screen" class="screen home-screen" aria-label="Home">
      <header class="brand-header">
        <img class="brand-logo" src="logo.png" alt="Tafazzi Project">
      </header>

      <div class="play-area">
        <div id="pulse-stage" class="pulse-stage" aria-hidden="true">
          <span class="pulse-ring ring-1"></span>
          <span class="pulse-ring ring-2"></span>
          <span class="pulse-ring ring-3"></span>
          <span class="pulse-ring ring-4"></span>
        </div>

        <button id="playButton" class="main-play-button" type="button" aria-label="Riproduci un audio casuale"
          aria-pressed="false">
          <span id="play-button-text">PLAY</span>
        </button>

        <p id="play-status" class="play-status" aria-live="polite"></p>
      </div>

      <div class="home-switches" aria-label="Categorie da includere nella riproduzione casuale">
        <div class="home-switch-row">
          <span class="home-switch-label">SAFE</span>
          <button id="home-safe-switch" class="toggle-switch is-on" type="button" role="switch" aria-checked="true"
            aria-label="Includi audio safe">
            <span class="toggle-knob"></span>
          </button>
        </div>

        <div class="home-switch-row">
          <span class="home-switch-label">NOT SAFE</span>
          <button id="home-unsafe-switch" class="toggle-switch" type="button" role="switch" aria-checked="false"
            aria-label="Includi audio not safe">
            <span class="toggle-knob"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="library-screen" class="screen library-screen is-hidden" aria-label="Library">
      <header class="library-header">
        <div class="library-heading-row">
          <h1>LIBRARY</h1>
          <span id="library-count" class="library-count">0 AUDIO</span>
        </div>
      </header>

      <div class="library-filter" role="group" aria-label="Filtro contenuti Library">
        <button id="safe-tab" type="button" data-mode="safe" class="library-filter-button is-active">SAFE</button>
        <button id="nsfw-tab" type="button" data-mode="unsafe" class="library-filter-button">NOT SAFE</button>
        <button id="all-tab" type="button" data-mode="all" class="library-filter-button">TUTTI</button>
      </div>

      <label class="library-search-wrap" for="library-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
        <input id="library-search" type="search" placeholder="CERCA AUDIO" autocomplete="off">
      </label>

      <div id="audio-list" class="audio-list"></div>
    </section>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Navigazione principale">
      <button id="home-tab" type="button" class="nav-item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 10.6 12 3l9 7.6V21h-6v-6H9v6H3Z"></path>
        </svg>
        <span>HOME</span>
      </button>
      <button id="library-tab" type="button" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm2 3v11h2V7H7Zm4 0v11h2V7h-2Zm4 0v11h2V7h-2Z">
          </path>
        </svg>
        <span>LIBRARY</span>
      </button>
    </nav>
  </main>
</body>

</html>
